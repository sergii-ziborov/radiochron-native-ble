[package]
name = "radiochron-native-ble"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Tokio-free native BLE scanning for RadioChron on Windows, Linux, and macOS"
license = "MIT"
authors = ["Sergii Ziborov"]
homepage = "https://radiochron.com"
repository = "https://github.com/sergii-ziborov/radiochron-native-ble"
documentation = "https://docs.rs/radiochron-native-ble"
readme = "README.md"
keywords = ["bluetooth", "ble", "radiochron", "winrt", "bluez"]
categories = ["hardware-support", "network-programming"]

[dependencies]
radiochron = { version = "=0.5.0", default-features = false, features = ["ble"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
dispatch2 = "0.3.0"
objc2-core-bluetooth = { version = "0.3.2", features = [
    "CBAdvertisementData",
    "CBCentralManager",
    "CBManager",
    "CBPeer",
    "CBPeripheral",
    "CBUUID",
    "dispatch2",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSUUID",
    "NSString",
    "NSValue",
] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
